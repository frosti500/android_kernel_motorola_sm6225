name: Fix KSU submodule and symlink

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-ksu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          persist-credentials: true

      - name: Remove broken gitlink entry
        run: |
          git rm -f --cached KernelSU-Next || true
          rm -rf KernelSU-Next

      - name: Clone KernelSU-Next as plain files (no nested .git)
        run: |
          git clone https://github.com/rifsxd/KernelSU-Next KernelSU-Next
          rm -rf KernelSU-Next/.git

      - name: Fix drivers/kernelsu symlink
        run: |
          if [ -L drivers/kernelsu ] || [ -e drivers/kernelsu ]; then
            rm -rf drivers/kernelsu
          fi
          cp -r KernelSU-Next/kernel drivers/kernelsu
          ls -la drivers/kernelsu | head -10

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add KernelSU-Next as real files (no submodule/symlink), fix drivers/kernelsu"
          git push origin lineage-23.2

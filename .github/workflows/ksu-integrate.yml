name: Integrate KernelSU Next

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-ksu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          persist-credentials: true

      - name: Create device-specific kernel config fragment
        run: |
          mkdir -p vendor/ext_config
          cat > vendor/ext_config/devon-default.config << 'EOF'
          # KernelSU Next
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=y
          EOF
          echo "----- Created file: -----"
          cat vendor/ext_config/devon-default.config

      - name: Run KernelSU Next setup script
        run: |
          curl -LSs 'https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh' | bash -s next

      - name: Show what changed
        run: |
          git status
          git diff --stat

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate KernelSU Next (kprobe method) + add devon-default.config"
          git push origin lineage-23.2
